# nginx sirve la SPA y reenvía /api al contenedor del backend.
# Así navegador, SPA y API comparten el mismo origen: la cookie de
# sesión funciona sin configurar CORS en Spring Boot.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rutas de Angular (/procesos, /roles, ...): siempre devuelven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash en el nombre se pueden guardar en caché mucho tiempo
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
