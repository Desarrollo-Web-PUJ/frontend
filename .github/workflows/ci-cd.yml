# CI/CD del frontend
#
#  1. pruebas     (GitHub, Ubuntu): instala dependencias, corre las pruebas
#                 unitarias (Vitest) y compila Angular para producción.
#  2. imagen      (GitHub, Ubuntu): construye la imagen Docker (Angular + nginx).
#  3. despliegue  (runner propio del equipo, "self-hosted"): descarga backend y
#                 frontend y actualiza el contenedor del frontend con Docker Compose.
#
# El despliegue solo corre en un push a main y si la variable del repositorio
# DESPLIEGUE_HABILITADO vale "true". Secretos requeridos: DB_PASSWORD y JWT_SECRET.

name: CI/CD frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Probar y compilar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas unitarias
        run: npm test -- --watch=false

      - name: Compilar para producción
        run: npm run build

  imagen:
    name: Construir imagen Docker
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t procesos-frontend:${{ github.sha }} .

  despliegue:
    name: Desplegar con Docker Compose
    needs: imagen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DESPLIEGUE_HABILITADO == 'true'
    runs-on: self-hosted
    steps:
      - name: Descargar el frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Descargar el backend (contiene docker-compose.yml)
        uses: actions/checkout@v4
        with:
          repository: Desarrollo-Web-PUJ/backend-jwt
          path: backend

      - name: Crear el archivo .env con los secretos
        shell: pwsh
        working-directory: backend
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          @(
            "DB_NAME=proyecto_db",
            "DB_USERNAME=proyecto_user",
            "DB_PASSWORD=$env:DB_PASSWORD",
            "JWT_SECRET=$env:JWT_SECRET",
            "JWT_EXPIRACION_MINUTOS=60",
            "FRONTEND_PORT=4200",
            "BACKEND_PORT=8080",
            "DB_PORT=5433"
          ) | Set-Content -Path .env -Encoding utf8

      - name: Actualizar el contenedor del frontend
        shell: pwsh
        working-directory: backend
        run: docker compose -p procesos up -d --build frontend

      - name: Verificar el despliegue
        shell: pwsh
        run: |
          for ($i = 1; $i -le 30; $i++) {
            try {
              $web = Invoke-WebRequest -Uri http://localhost:4200/ -UseBasicParsing
              if ($web.StatusCode -eq 200) { Write-Host "Frontend desplegado"; exit 0 }
            } catch { }
            Start-Sleep -Seconds 10
          }
          throw "El frontend no respondió a tiempo"
